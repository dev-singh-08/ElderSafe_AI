{% extends "base.html" %}

{% block title %}Login | ElderSafe AI{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Sign in to access your ElderSafe AI dashboard.
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit"
                    class="btn btn-primary form-submit">

                Sign In

            </button>

        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Create one
            </a>

        </div>

    </div>

</div>

{% endblock %}
