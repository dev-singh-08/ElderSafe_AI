{% extends "base.html" %}

{% block title %}Create Account | ElderSafe AI{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Create your ElderSafe AI monitoring account.
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button type="submit"
                    class="btn btn-primary form-submit">
                Create Account
            </button>

        </form>


        <div class="auth-link">

            Already have an account?

            <a href="{{ url_for('signin') }}">
                Sign in
            </a>

        </div>

    </div>

</div>

{% endblock %}
